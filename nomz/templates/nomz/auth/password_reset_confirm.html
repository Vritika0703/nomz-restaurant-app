{% extends 'nomz/base.html' %}
{% load static %}

{% block title %}Reset Password - nomz{% endblock %}

{% block content %}
<!-- Animated Gradient Background -->
<div class="animated-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
</div>

<div class="auth-container">
    <!-- Main Content -->
    <div class="main-content">
        <!-- Logo -->
        <h1 class="logo-text">nomz</h1>

        <!-- Glass Card Container -->
        <div class="form-container">
            <div class="glass-card">
                <h2 class="form-title">Set New Password</h2>
                <p class="form-subtitle">Choose a strong password to secure your account.</p>

                <p id="confirm-error" class="error-message"></p>

                <form id="confirm-form" class="confirm-form">
                    <div class="input-group">
                        <input
                            type="password"
                            id="password1"
                            name="password1"
                            placeholder=" "
                            required
                        />
                        <label for="password1">New Password</label>
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            id="password2"
                            name="password2"
                            placeholder=" "
                            required
                        />
                        <label for="password2">Confirm Password</label>
                    </div>

                    <button type="submit" id="confirm-submit" class="submit-button">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    {% include 'nomz/components/footer.html' %}
</div>

<style>
/* Animated Gradient Background */
.animated-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #FFF9F5 0%, #FFE8EC 50%, #FFF0F3 100%);
    overflow: hidden;
    z-index: 0;
}

.gradient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: float 20s ease-in-out infinite;
}

.orb-1 {
    width: 400px;
    height: 400px;
    background: linear-gradient(135deg, #E06E7F 0%, #FF9AA2 100%);
    top: -100px;
    right: -100px;
    animation-delay: 0s;
}

.orb-2 {
    width: 500px;
    height: 500px;
    background: linear-gradient(135deg, #FFB6C1 0%, #FFC9DE 100%);
    bottom: -150px;
    left: -150px;
    animation-delay: 7s;
}

.orb-3 {
    width: 350px;
    height: 350px;
    background: linear-gradient(135deg, #FFDEE9 0%, #FFE8E8 100%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: 14s;
}

@keyframes float {
    0%, 100% {
        transform: translate(0, 0) scale(1);
    }
    33% {
        transform: translate(50px, -50px) scale(1.1);
    }
    66% {
        transform: translate(-50px, 50px) scale(0.9);
    }
}

/* Auth Container */
.auth-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    position: relative;
}

/* Main Content */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 32px;
    position: relative;
    z-index: 1;
}

/* Logo */
.logo-text {
    font-size: 56px;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #E06E7F 0%, #FF8FA3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 48px;
    font-weight: 900;
    animation: fadeInUp 0.8s ease-out;
    text-shadow: 0 4px 20px rgba(224, 110, 127, 0.2);
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Form Container */
.form-container {
    width: 100%;
    max-width: 480px;
    animation: fadeInUp 1s ease-out;
}

/* Glass Card */
.glass-card {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08),
        0 8px 24px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Form Title */
.form-title {
    font-size: 28px;
    text-align: center;
    margin-bottom: 12px;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #333 0%, #555 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
}

/* Form Subtitle */
.form-subtitle {
    text-align: center;
    margin-bottom: 32px;
    font-size: 14px;
    color: #666;
    font-family: 'Montserrat', sans-serif;
    line-height: 1.6;
}

/* Error Message */
.error-message {
    font-size: 14px;
    margin-bottom: 20px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    color: #dc2626;
    display: none;
    padding: 14px 20px;
    background: rgba(220, 38, 38, 0.08);
    border-radius: 16px;
    border: 1px solid rgba(220, 38, 38, 0.2);
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Confirm Form */
.confirm-form {
    display: flex;
    flex-direction: column;
    gap: 28px;
}

/* Input Group */
.input-group {
    position: relative;
}

.input-group label {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    font-family: 'Montserrat', sans-serif;
    color: #999;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    background: transparent;
    padding: 0 4px;
}

.input-group input {
    width: 100%;
    padding: 18px 20px;
    border: 2px solid rgba(224, 110, 127, 0.15);
    border-radius: 16px;
    font-size: 15px;
    font-family: 'Montserrat', sans-serif;
    background: rgba(255, 255, 255, 0.6);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
}

.input-group input:focus {
    outline: none;
    border-color: #E06E7F;
    background: rgba(255, 255, 255, 0.9);
    box-shadow:
        0 8px 24px rgba(224, 110, 127, 0.12),
        0 0 0 4px rgba(224, 110, 127, 0.08);
    transform: translateY(-2px);
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
    top: 0;
    font-size: 12px;
    color: #E06E7F;
    font-weight: 600;
    background: linear-gradient(to bottom, transparent 50%, rgba(255, 255, 255, 0.9) 50%);
}

/* Submit Button */
.submit-button {
    padding: 18px 32px;
    border-radius: 16px;
    color: white;
    font-size: 16px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    background: linear-gradient(135deg, #E06E7F 0%, #FF8FA3 100%);
    border: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow:
        0 8px 24px rgba(224, 110, 127, 0.3),
        0 4px 12px rgba(224, 110, 127, 0.2);
    position: relative;
    overflow: hidden;
}

.submit-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s;
}

.submit-button:hover::before {
    left: 100%;
}

.submit-button:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow:
        0 12px 32px rgba(224, 110, 127, 0.4),
        0 6px 16px rgba(224, 110, 127, 0.3);
}

.submit-button:active:not(:disabled) {
    transform: translateY(-1px);
}

.submit-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background: linear-gradient(135deg, #ccc 0%, #bbb 100%);
}

/* Responsive Design */
@media (max-width: 640px) {
    .glass-card {
        padding: 36px 28px;
        border-radius: 20px;
    }

    .logo-text {
        font-size: 44px;
        margin-bottom: 36px;
    }

    .form-title {
        font-size: 24px;
    }

    .gradient-orb {
        filter: blur(60px);
    }
}
</style>

<script>
document.getElementById('confirm-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const pwd1 = document.getElementById('password1').value;
    const pwd2 = document.getElementById('password2').value;
    const btn = document.getElementById('confirm-submit');
    const errorDisplay = document.getElementById('confirm-error');

    errorDisplay.style.display = 'none';
    errorDisplay.textContent = '';

    if (pwd1 !== pwd2) {
        errorDisplay.textContent = 'Passwords do not match.';
        errorDisplay.style.display = 'block';
        return;
    }

    if (pwd1.length < 8) {
        errorDisplay.textContent = 'Password must be at least 8 characters long.';
        errorDisplay.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    const params = new URLSearchParams(window.location.search);

    try {
        const r = await apiFetch('/api/auth/password-reset/confirm/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                uidb64: params.get('uid'),
                token: params.get('token'),
                new_password1: pwd1,
                new_password2: pwd2
            })
        });

        if (r.ok) {
            window.location.href = '/password-reset/complete/';
        } else {
            errorDisplay.textContent = 'Failed to reset password. The link may be invalid or expired.';
            errorDisplay.style.display = 'block';
        }
    } catch {
        errorDisplay.textContent = 'Network error. Please try again.';
        errorDisplay.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
});
</script>
{% endblock %}
