{% extends 'nomz/base.html' %}
{% block main_layout %}
{% include 'nomz/components/premium_design.html' %}
<style>
    nav.navbar { display: none !important; }
    .report-container { max-width: 600px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
    .report-title { font-family: var(--font-sans); font-size: 28px; font-weight: 700; color: var(--red); margin-bottom: 0.5rem; }
    .report-desc { color: #8a7e75; font-size: 14px; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid rgba(0,0,0,0.1); font-size: 15px; font-family: inherit; transition: all 0.2s; background: #fafafa; }
    .form-control:focus { outline: none; border-color: var(--red); background: white; box-shadow: 0 0 0 4px rgba(212, 43, 43, 0.1); }
    .submit-btn { width: 100%; padding: 14px; background: var(--red); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 1rem; }
    .submit-btn:hover { background: #b82020; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(212, 43, 43, 0.2); }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
</style>

{% include 'nomz/components/premium_nav.html' %}

<div class="report-container">
    <h1 class="report-title">Report Content</h1>
    <p class="report-desc">Please let us know why you are reporting this. Our moderation team will review it shortly.</p>
    
    <form id="report-form">
        <div class="form-group">
            <label class="form-label">Reason</label>
            <select id="reason" class="form-control" required>
                <option value="" disabled selected>Select a reason...</option>
                <option value="SPAM">Spam or misleading</option>
                <option value="FRAUD">Fraudulent activity</option>
                <option value="HARASSMENT">Harassment or hate speech</option>
                <option value="INAPPROPRIATE">Inappropriate content</option>
                <option value="OTHER">Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Additional Details</label>
            <textarea id="details" class="form-control" rows="5" placeholder="Provide more context to help our team investigate..." required></textarea>
        </div>
        
        <button type="submit" id="submit-btn" class="submit-btn">Submit Report</button>
    </form>
</div>

<script>
document.getElementById('report-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    
    try {
        const response = await fetch('/api/report/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                content_type: '{{ content_type }}',
                content_id: parseInt('{{ content_id }}'),
                reason: document.getElementById('reason').value,
                details: document.getElementById('details').value
            })
        });
        
        if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || 'Failed to submit report');
        }
        
        alert('Thank you. Your report has been submitted successfully.');
        history.back();
    } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = 'Submit Report';
    }
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
