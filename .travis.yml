language: python
python:
  - "3.12"

cache:
  pip: true

# Services required for testing
services:
  - postgresql

before_script:
  # Never use $$ here — the shell replaces it with the process ID and breaks psql.
  - psql -U postgres -v ON_ERROR_STOP=1 -c "DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'travis') THEN CREATE ROLE travis LOGIN PASSWORD 'travis'; END IF; END $$;"
  - psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "nomz-db" OWNER travis;' || true
  - psql -U postgres -v ON_ERROR_STOP=1 -c 'GRANT ALL PRIVILEGES ON DATABASE "nomz-db" TO travis;'

install:
  - pip install --upgrade pip
  - pip install -r requirements-dev.txt

env:
  global:
    - DEBUG=True
    - SECRET_KEY=test-secret-key-for-travis-ci
    - ALLOWED_HOSTS=localhost,127.0.0.1,testserver
    - DB_ENGINE=django.db.backends.postgresql
    - DB_NAME=nomz-db
    - DB_USER=travis
    - DB_PASSWORD=travis
    - DB_HOST=127.0.0.1
    - DB_PORT=5432
    - USE_S3=False
    - ENVIRONMENT=testing

# Test script
script:
  - python manage.py check
  - python manage.py migrate --no-input
  - coverage run --source='nomz' manage.py test --no-input --verbosity=2
  - black --check .
  - flake8 .

# Send coverage to Coveralls
after_success:
  - coverage xml
  - coveralls 

# IMPORTANT:
# Do not build frontend in Travis deploy job. Building in CI mutates the working
# tree and can produce oversized/corrupt EB bundles.

# Deploy to AWS Elastic Beanstalk on production branch
deploy:
  provider: elasticbeanstalk
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY
  region: us-east-1
  app: nomz-app
  env: nomz-prod
  bucket_name: nomz-static-files-friend-2026
  bucket_path: deployments
  on:
