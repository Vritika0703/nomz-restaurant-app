language: python
python:
  - "3.12"

cache:
  pip: true

# Services required for testing
services:
  - postgresql

before_script:
  - psql -U postgres -c "CREATE ROLE travis LOGIN PASSWORD 'travis';" || true
  - psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "nomz-db" OWNER travis;' || true

install:
  - pip install --upgrade pip
  - pip install -r requirements-dev.txt

env:
  global:
    - DEBUG=True
    - SECRET_KEY=test-secret-key-for-travis-ci
    - ALLOWED_HOSTS=localhost,127.0.0.1,testserver
    - DB_ENGINE=django.db.backends.postgresql
    - DB_NAME=nomz-db
    - DB_USER=travis
    - DB_PASSWORD=travis
    - DB_HOST=127.0.0.1
    - DB_PORT=5432
    - USE_S3=False
    - ENVIRONMENT=testing

# Test script
script:
  - python manage.py check
  - python manage.py migrate --no-input
  - coverage run --source='nomz' manage.py test --no-input --verbosity=2
  - black --check .
  - flake8 .

# Send coverage to Coveralls
after_success:
  - coverage xml
  - coveralls

# IMPORTANT:
# Do not build frontend in Travis deploy job. Building in CI mutates the working
# tree and can produce oversized/corrupt EB bundles.

# Dual-deploy: strict branch isolation.
#   develop -> nomz-dev  (staging AWS account 709436855295, nomzdev.dpdns.org)
#   production -> nomz-prod (production AWS account 554903866296, nomz.dpdns.org)
# Per-branch credentials keep the two AWS accounts fully separate.
deploy:
  - provider: elasticbeanstalk
    skip_cleanup: true
    access_key_id: $AWS_DEVELOP_ACCESS_KEY_ID
    secret_access_key: $AWS_DEVELOP_SECRET_ACCESS_KEY
    region: us-east-1
    app: nomz-app
    env: nomz-dev
    bucket_name: nomz-static-files-friend2-dev
    bucket_path: deployments
    on:
      branch: develop
      condition: $TRAVIS_TEST_RESULT = 0 && $TRAVIS_PULL_REQUEST = false

  - provider: elasticbeanstalk
    skip_cleanup: true
    access_key_id: $AWS_PRODUCTION_ACCESS_KEY_ID
    secret_access_key: $AWS_PRODUCTION_SECRET_ACCESS_KEY
    region: us-east-1
    app: nomz-app
    env: nomz-prod
    bucket_name: nomz-static-files-friend-2026
    bucket_path: deployments
    on:
      branch: production
      condition: $TRAVIS_TEST_RESULT = 0 && $TRAVIS_PULL_REQUEST = false

# Branches to build (main is deprecated and intentionally excluded)
branches:
  only:
    - develop
    - production

# Notifications (optional)
notifications:
  email:
    on_success: change
    on_failure: always
