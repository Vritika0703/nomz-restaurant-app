language: python
python:
  - "3.12"

dist: jammy

cache:
  pip: true

services:
  - postgresql

before_script:
  # Never use $$ here — the shell replaces it with the process ID and breaks psql.
  - psql -U postgres -c "CREATE ROLE travis LOGIN PASSWORD 'travis';" || true
  - psql -U postgres -c 'CREATE DATABASE "nomz-db" OWNER travis;' || true
  - psql -U postgres -c 'GRANT ALL PRIVILEGES ON DATABASE "nomz-db" TO travis;'

install:
  - pip install --upgrade pip
  - pip install -r requirements-dev.txt

env:
  global:
    - DEBUG=True
    - SECRET_KEY=test-secret-key-for-travis-ci
    - ALLOWED_HOSTS=localhost,127.0.0.1,testserver
    - DB_ENGINE=django.db.backends.postgresql
    - DB_NAME=nomz-db
    - DB_USER=travis
    - DB_PASSWORD=travis
    - DB_HOST=127.0.0.1
    - DB_PORT=5432
    - USE_S3=False
    - ENVIRONMENT=testing

script:
  - python manage.py migrate --no-input
  - pytest --cov=nomz

after_success:
  - coveralls --service=travis-ci

after_script:
  - coveralls --finish

deploy:
  provider: elasticbeanstalk
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY
  region: us-east-1
  app: nomz-app
  env: nomz-prod
  bucket_name: nomz-static-files-friend-2026
  bucket_path: deployments
  on:
    branch: develop
