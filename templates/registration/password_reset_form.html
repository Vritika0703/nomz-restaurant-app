{% extends 'nomz/base.html' %}

{% block title %}Forgot password - Nomz{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-header">
            <h2>Forgot password?</h2>
            <p class="mb-0 mt-2 opacity-75 small">Enter your email and we'll send you a reset link.</p>
        </div>
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="{{ form.email.id_for_label }}" class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control" id="{{ form.email.id_for_label }}"
                           placeholder="Enter your registered email" required autofocus
                           value="{{ form.email.value|default:'' }}">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Send reset link</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-muted small">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
