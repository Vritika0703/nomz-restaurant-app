{% extends 'nomz/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Update Preferences - Nomz{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Update My Dining Preferences</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">Tell us your tastes so we can surface the best NYC restaurants for you!</p>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Save Preferences</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
